# Career-Ops scanner input. The list is intentionally diversified across large
# employers and smaller AI/data/infra companies. `careers_url` stays first-party
# where possible; ATS URLs are used only where Career-Ops can scan them directly.
# `scan_method: websearch` means Codex follows the official careers page and
# hands the resulting postings to the same deterministic triage pipeline.
title_filter:
  positive: [intern, internship, co-op, research]
content_filter:
  positive: [CUDA, Triton, inference, serving, GPU, PyTorch, LLM, distributed systems, ML infrastructure, compiler, machine learning]
  negative: [sales, recruiter, marketing, legal, finance]
location_filter:
  allow: [United States, USA, Remote, Seattle, California, New York, Austin, Boston, Champaign, Chicago]
  strict: false

# Big tech and established platforms. These pages are dynamic or use search
# systems that Career-Ops does not scrape as a native provider, so Codex should
# visit the official page and record the exact posting URL.
tracked_companies:
  - {name: Google, careers_url: "https://www.google.com/about/careers/applications/", scan_method: websearch, scan_query: "site:google.com/about/careers Software Engineering Intern 2027 AI infrastructure"}
