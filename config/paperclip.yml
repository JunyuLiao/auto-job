paperclip:
  enabled: true
  project:
    organization: "Personal Career Search"
    goal: "Find the best Summer 2027 U.S. internship opportunities"
    name: "Summer 2027 Job Search"
  scout:
    name: "Job Scout"
    role: "scout"
    schedule: "30 10 * * *"
